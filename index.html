// ── ÁREA CLAUDE CODE ──
function renderClaudeArea(area) {
  const det = area.detalhe||{};
  const t = det.totals||{};
  const cost = det.cost||{};
  const level = det.level||{};
  const trends = det.trends?.wow||{};
  const ph = det.peakHours||{};
  const meta = D.meta||{};
  const cor = area.cor || 'var(--red)';

  const body = $('detail-body');
  body.style.setProperty('--area-color', cor);

  // receita do mês (lida da área Finanças)
  const fin = (D.areas||[]).find(a=>a.id==='financas');
  const receitaMes = Number(fin?.detalhe?.campos?.receitaMes) || 0;

  // Maestria
  const M = maestriaScore(det, receitaMes);
  const fraca = [...M.subs].sort((a,b)=>a.score-b.score)[0];
  const apex = M.total>=90 ? 'Ápice — Claude é ferramenta milionária.'
    : M.total>=70 ? 'Forte — perto de milionário.'
    : M.total>=45 ? 'Médio — alavancando, falta caixa.'
    : M.total>=20 ? 'Inicial — muito esforço, pouco retorno.'
    : 'Cru — Claude ainda não vira dinheiro.';

  // Decisão
  const burn = M.burn;
  const now = new Date();
  const diaMes = now.getDate();
  const diasNoMes = new Date(now.getFullYear(), now.getMonth()+1, 0).getDate();
  const projecao = diaMes>0 ? burn/diaMes*diasNoMes : burn;
  const ativos = M.ativos;
  const dispCls = ativos<=2 ? 'ok' : ativos<=4 ? 'warn' : 'bad';
  const dCaixa = diasAte(meta.caixaData);
  const dOff = diasAte(meta.claudeOffData);

  // ROI
  const roiCls = receitaMes<=0 ? 'na' : receitaMes>=burn ? 'ok' : 'bad';
  const roiSig = receitaMes<=0 ? '⚪' : receitaMes>=burn ? '🟢' : '🔴';

  // Projetos por custo + tags
  const projs = (det.projects||[]).slice().sort((a,b)=>(b.cost?.brl||0)-(a.cost?.brl||0));
  const TAGS = { caixa:{ic:'💰',lb:'Caixa'}, dispersao:{ic:'🔬',lb:'Dispersão'}, infra:{ic:'🛠',lb:'Infra'} };
  const totBrl = projs.reduce((s,p)=>s+(p.cost?.brl||0),0) || 1;
  const caixaBrl = projs.filter(p=>p.tag==='caixa').reduce((s,p)=>s+(p.cost?.brl||0),0);
  const pctCaixa = Math.round(caixaBrl/totBrl*100);

  body.innerHTML = `
    <!-- MAESTRIA (momento-assinatura) -->
    <div class="card mb16 maestria">
      <div class="mst-main">
        <div class="mst-gauge">${gaugeHtml(M.total, cor)}<div class="mst-num">${M.total}<small>/100</small></div></div>
        <div class="mst-info">
          <div class="mst-title">Maestria Claude</div>
          <div class="mst-apex">${apex}</div>
          <div class="mst-lever">Maior alavanca: <b>${esc(fraca.label)}</b> — ${esc(fraca.tip)}</div>
        </div>
      </div>
      <div class="mst-subs">
        ${M.subs.map(s=>`<div class="mst-sub">
          <div class="mst-sub-head"><span>${esc(s.label)}</span><span class="mst-sub-n">${s.score}</span></div>
          <div class="mst-bar"><div class="mst-fill" style="width:${s.score}%"></div></div>
          <div class="mst-sub-w">peso ${s.weight}</div>
        </div>`).join('')}
      </div>
    </div>

    <!-- PAINEL DE DECISÃO -->
    <div class="decision-strip mb16">
      <div class="dec-tile">
        <div class="dec-label">Burn do mês</div>
        <div class="dec-val">${fmtBrl(burn,0)}</div>
        <div class="dec-sub">projeção ${fmtBrl(projecao,0)}</div>
      </div>
      <div class="dec-tile ${dispCls}">
        <div class="dec-label">Dispersão</div>
        <div class="dec-val">${ativos}<small> proj/7d</small></div>
        <div class="dec-sub">${ativos<=2?'foco bom':ativos<=4?'atenção':'⚠ disperso'}</div>
      </div>
      <div class="dec-tile ${dCaixa!=null&&dCaixa<0?'bad':''}">
        <div class="dec-label">Meta de caixa</div>
        <div class="dec-val">${dCaixa==null?'—':dCaixa<0?'venceu':dCaixa+'d'}</div>
        <div class="dec-sub">${fmtBrl(meta.caixaValor,0)} · ${esc((meta.caixaData||'').slice(5))}</div>
      </div>
      <div class="dec-tile">
        <div class="dec-label">Claude desliga</div>
        <div class="dec-val">${dOff==null?'—':dOff<0?'off':dOff+'d'}</div>
        <div class="dec-sub">janela de dev</div>
      </div>
    </div>

    <!-- ROI -->
    <div class="card mb16 roi ${roiCls}">
      <div class="roi-sig">${roiSig}</div>
      <div class="roi-body">
        <div class="roi-line">Gastou <b>${fmtBrl(burn,0)}</b> em Claude este mês · faturou <b>${fmtBrl(receitaMes,0)}</b></div>
        <div class="roi-msg">${receitaMes<=0?'Sem receita registrada — registre em Finanças. Hoje o Claude é só custo.':receitaMes>=burn?'O Claude se paga. Próximo nível: multiplicar.':'Queima mais do que entra. Foco em fechar caixa.'}</div>
      </div>
    </div>

    <!-- PROJETOS + TAGS -->
    <div class="card mb16">
      <div class="card-title">Projetos — pra onde foi o dinheiro <span style="color:var(--text3);font-weight:400">· ${pctCaixa}% em caixa</span></div>
      <div class="proj-bar"><div class="proj-bar-fill" style="width:${pctCaixa}%"></div></div>
      <div class="proj-list">
        ${projs.map(p=>{
          const cooled = p.lastActive && (Date.now()-p.lastActive)>7*86400000;
          return `<div class="proj-row">
            <div class="proj-id">
              <span class="proj-name">${esc(p.name)}</span>
              <span class="proj-meta">${fmtN(p.sessions)} sess · ${fmtRel(p.lastActive)}${cooled?' · <span class="cooled">esfriou</span>':''}</span>
            </div>
            <div class="proj-cost">${p.cost?.brl?fmtBrl(p.cost.brl,0):'—'}</div>
            <div class="proj-tags">
              ${Object.entries(TAGS).map(([k,v])=>`<button class="ptag ${p.tag===k?'on '+k:''}" data-action="proj-tag" data-proj="${esc(p.id)}" data-tag="${k}" title="${v.lb}">${v.ic}</button>`).join('')}
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>

    <!-- PRÓXIMAS ALAVANCAS -->
    <div class="card mb16">
      <div class="card-title">Próximas alavancas — construir pra subir a Maestria</div>
      <div class="lever-list">${LEVERS.map(l=>`<div class="lever-item">
        <span class="lever-ic">${l.ic}</span>
        <div><div class="lever-t">${esc(l.t)}</div><div class="lever-d">${esc(l.d)}</div></div>
      </div>`).join('')}</div>
    </div>

    <!-- EXTRAS (gamificação / detalhes) -->
    <div class="extras-head">Extras · gamificação e detalhes</div>
    <div class="grid2 mb16">
      <div class="card"><div class="card-title">Atividade semanal</div><div id="cc-week-chart"></div></div>
      <div class="card"><div class="card-title">Tendências (semana vs anterior)</div><div id="cc-trends"></div></div>
    </div>
    <div class="grid2 mb16">
      <div class="card"><div class="card-title">Coach</div><div id="cc-coach"></div></div>
      <div class="card"><div class="card-title">Pico de atividade</div><div id="cc-peak"></div></div>
    </div>
    <div class="grid2 mb16">
      <div class="card"><div class="card-title">Conquistas</div><div class="ach-grid" id="cc-ach"></div></div>
      <div class="card"><div class="card-title">Objetivos Claude</div><div id="cc-goals"></div></div>
    </div>
    <div class="grid2 mb16">
      <div class="card"><div class="card-title">Por modelo</div><div id="cc-models"></div></div>
      <div class="card"><div class="card-title">Custo por semana (últimas 12)</div><div id="cc-costweek"></div></div>
    </div>
    <div class="grid2 mb16">
      <div class="card"><div class="card-title">Skills</div><div class="skill-grid" id="cc-skills"></div></div>
      <div class="card"><div class="card-title">MCPs conectados</div><div class="skill-grid" id="cc-mcps"></div></div>
    </div>
  `;

  // tag de projeto: clica pra marcar; clica de novo pra remover
  body.querySelectorAll('[data-action="proj-tag"]').forEach(btn=>{
    btn.addEventListener('click',()=>guard(async()=>{
      const proj=btn.dataset.proj, tag=btn.dataset.tag;
      const cur=(projs.find(p=>p.id===proj)||{}).tag;
      const next = cur===tag ? null : tag;
      const r=await fetch('/api/config',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({projectTags:{[proj]:next}})});
      const j=await r.json();
      if(j.ok){ await load(false); toast(next?('Marcado: '+TAGS[next].lb):'Tag removida'); }
      else throw new Error(j.error||'erro');
    }));
  });

  // Week chart
  const weeks = det.activityWeeks||[];
  const maxW = Math.max(...weeks.map(w=>w.sessions),1);
  $('cc-week-chart').innerHTML = `<div class="week-bars">${weeks.slice(-12).map((w,i,a)=>`
    <div class="week-bar ${i===a.length-1?'cur':''}" style="height:${Math.max(4,Math.round(w.sessions/maxW*42))}px" title="${w.weekStart}: ${w.sessions}"></div>
  `).join('')}</div>
  <div style="font-size:10px;color:var(--text3);margin-top:5px;">${fmtN(det.avgSessionsPerWeek)} sessões/sem média · ${weeks.length} semanas</div>`;

  // Trends
  const tw = trends;
  if (tw.sessions) {
    $('cc-trends').innerHTML = ['Sessões','Custo','Subagentes'].map((lbl,i)=>{
      const k = ['sessions','cost','subagents'][i];
      const inv = k==='cost';
      const r = tw[k]||{};
      return `<div style="display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--border);">
        <span style="font-size:12px;color:var(--text2)">${lbl}</span>
        <span style="font-size:12px;font-family:var(--mono)">${fmtN(r.thisWeek)}</span>
        <span>${delta(r.delta,r.pct,inv)}</span>
      </div>`;
    }).join('') + `<div style="font-size:11px;color:var(--text3);margin-top:7px;">Concentração: ${det.trends?.concentration?.score||0}%</div>`;
  }

  // Coach
  const coach = D.claudeRaw?.coach;
  if (coach?.primary) {
    const p = coach.primary;
    $('cc-coach').innerHTML = `
      <div class="coach-primary" style="margin-bottom:0">
        <div class="coach-tag">${p.alvo?.tipo||'dica'}</div>
        <div class="coach-title">${esc(p.titulo)}</div>
        <div class="coach-acao">${esc(p.acao)}</div>
        <div class="coach-porque">${esc(p.porque)}</div>
        ${p.estimatedXp?`<div class="coach-xp">+${p.estimatedXp} XP</div>`:''}
      </div>
    `;
  }

  // Peak heatmap
  if (ph.matrix) {
    const days=['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];
    const max=Math.max(...ph.matrix.flat(),1);
    let h='<div class="heatmap">';
    h+='<div></div>'+days.map(d=>`<div style="text-align:center;font-size:9px;color:var(--text3);padding-bottom:2px">${d}</div>`).join('');
    for(let hr=6;hr<=23;hr++){
      h+=`<div style="display:flex;align-items:center;justify-content:flex-end;padding-right:3px;font-size:9px;color:var(--text3);height:14px">${hr}</div>`;
      for(let d=0;d<7;d++){
        const v=ph.matrix[hr][d];
        const l=v===0?0:v<max*.25?1:v<max*.5?2:v<max*.75?3:4;
        h+=`<div class="hm-cell hm${l}" title="${days[d]} ${hr}h: ${v}"></div>`;
      }
    }
    h+='</div>';
    if(ph.peakLabel) h+=`<div style="font-size:11px;color:var(--text3);margin-top:5px">Pico: ${esc(ph.peakLabel)}</div>`;
    $('cc-peak').innerHTML=h;
  }

  // Conquistas
  const achs = [...(det.achievements||[])].sort((a,b)=>{
    if(a.conquistada&&!b.conquistada) return -1;
    if(!a.conquistada&&b.conquistada) return 1;
    return (a._progress?.restante??999)-(b._progress?.restante??999);
  });
  $('cc-ach').innerHTML = achs.map(a=>{
    const p=a._progress;
    const pct=p?Math.round(p.atual/p.meta*100):0;
    return `<div class="ach-item ${a.conquistada?'earned':''}">
      <div class="ach-icon">${a.icone}</div>
      <div>
        <div class="ach-name">${esc(a.titulo)}</div>
        <div class="ach-desc">${esc(a.descricao)}</div>
        ${p?`<div style="font-size:10px;color:var(--text3);margin-top:3px">${p.atual}/${p.meta}</div><div class="ach-pbar"><div class="ach-pfill" style="width:${pct}%"></div></div>`:''}
      </div>
    </div>`;
  }).join('');

  // Goals por grupo
  const goals = det.goals?.goals||[];
  $('cc-goals').innerHTML = goals.map(g=>{
    const pct = g.percent||0;
    return `<div class="goal-block">
      <div class="goal-block-header">
        <span class="goal-block-icon">${g.icone}</span>
        <span class="goal-block-title">${esc(g.titulo)}</span>
        <span class="goal-block-pct">${pct}%</span>
      </div>
      <div class="goal-pbar"><div class="goal-pfill" style="width:${pct}%"></div></div>
      <div class="metas-list">
        ${g.marcos.map(m=>`<div class="meta-item ${m.feito?'done':''}">
          <div class="meta-check ${m.feito?'done':''} ${!m.auto?'clickable':''}" ${!m.auto?`data-marco="${esc(m.id)}"`:''}>${m.feito?'✓':''}</div>
          <span>${esc(m.texto)}</span>
          ${m.auto?'<span class="meta-group">auto</span>':''}
        </div>`).join('')}
      </div>
    </div>`;
  }).join('');
  // marco toggles
  $('cc-goals').querySelectorAll('[data-marco]').forEach(el=>{
    el.addEventListener('click',()=>guard(async()=>{
      const id=el.dataset.marco;
      el.textContent='…';
      const r=await fetch('/api/goals/toggle',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({marcoId:id})});
      const j=await r.json();
      if(j.ok){await load(false);toast(j.done?'✓ Feito':'Desmarcado');}
    }));
  });

  // Models
  $('cc-models').innerHTML = barRows(
    (cost.byModel||[]).filter(m=>m.model!=='<synthetic>'),
    'label','usd',fmtUsd
  );

  // Skills / MCPs
  const sk = det.skills||{};
  $('cc-skills').innerHTML = (sk.installed||[]).length
    ? sk.installed.map(s=>`<div class="skill-item"><div class="skill-name">${esc(s.name)}</div><div class="skill-type">${esc(s.type||'skill')}</div></div>`).join('')
    : '<div style="color:var(--text3);font-size:12px">Nenhuma</div>';
  $('cc-mcps').innerHTML = (sk.connectedMcp||[]).length
    ? sk.connectedMcp.map(m=>`<div class="skill-item"><div class="skill-name">${esc(m.name||m.server||'MCP')}</div><div class="skill-type">MCP</div></div>`).join('')
    : '<div style="color:var(--text3);font-size:12px">Nenhum</div>';

  // Cost by week
  $('cc-costweek').innerHTML = barRows((cost.weekly||[]).slice(-12),'weekStart','usd',fmtUsd);
}

// ── COCKPIT DE FINANÇAS (injetado no topo do detalhe quando area=financas) ──
function financasCockpitHtml(area){
  const c = (area.detalhe&&area.detalhe.campos)||{};
  const meta = D.meta||{};
  const num = v => (v==null||v==='')?null:Number(v);
  const n0 = v => num(v)||0;
  const receita=n0(c.receitaMes), recorrente=n0(c.receitaRecorrente), despesa=n0(c.despesasMes),
        reserva=n0(c.reservaEmergencia);
  const aReceber = (num(c.aReceber)!=null) ? n0(c.aReceber) : n0(area.detalhe&&area.detalhe.aReceberAuto);
  const alvo = n0(c.metaReceita) || n0(meta.caixaValor);
  const lucro = (num(c.receitaMes)!=null&&num(c.despesasMes)!=null) ? receita-despesa : null;
  const margem = (lucro!=null&&receita>0) ? Math.round(lucro/receita*100) : null;
  const runway = (num(c.reservaEmergencia)!=null&&despesa>0) ? reserva/despesa : null;
  const caixaPot = receita + aReceber;
  const arr = recorrente*12;
  const mrrCobre = despesa>0 ? Math.round(recorrente/despesa*100) : null;
  const faltaMrr = Math.max(0, despesa-recorrente);

  // trajetória até a meta
  const dias = diasAte(meta.caixaData);
  const falta = Math.max(0, alvo-receita);
  const pct = alvo>0 ? Math.min(100, Math.round(receita/alvo*100)) : 0;
  const porDia = (dias!=null&&dias>0) ? falta/dias : falta;
  const batida = alvo>0 && receita>=alvo;
  const trajMsg = alvo<=0 ? 'Defina uma meta de receita.'
    : batida ? '🎉 Meta batida. Próximo nível: subir a meta.'
    : (num(c.receitaMes)==null ? 'Registre a receita do mês pra ver o ritmo.'
      : `Faltam ${fmtBrl(falta,0)}${dias!=null&&dias>0?` · ${fmtBrl(porDia,0)}/dia em ${dias} dias`:(dias!=null&&dias<0?' · prazo vencido':'')}`);

  return `
    <div class="card mb16 fin-traj">
      <div class="card-title">Rumo à meta de caixa</div>
      <div class="fin-traj-top">
        <div class="fin-traj-val">${fmtBrl(receita,0)} <small>de ${fmtBrl(alvo,0)}</small></div>
        <div class="fin-traj-pct">${pct}%</div>
      </div>
      <div class="fin-bar"><div class="fin-bar-fill ${batida?'done':''}" style="width:${pct}%"></div></div>
      <div class="fin-traj-msg">${trajMsg}</div>
    </div>

    <div class="decision-strip mb16">
      <div class="dec-tile ${lucro!=null?(lucro>=0?'ok':'bad'):''}">
        <div class="dec-label">Lucro do mês</div>
        <div class="dec-val">${lucro!=null?fmtBrl(lucro,0):'—'}</div>
        <div class="dec-sub">${margem!=null?`margem ${margem}%`:'registre receita e despesa'}</div>
      </div>
      <div class="dec-tile ${runway!=null?(runway>=3?'ok':runway>=1?'warn':'bad'):''}">
        <div class="dec-label">Runway</div>
        <div class="dec-val">${runway!=null?runway.toLocaleString('pt-BR',{maximumFractionDigits:1})+'m':'—'}</div>
        <div class="dec-sub">fôlego sem vender</div>
      </div>
      <div class="dec-tile">
        <div class="dec-label">Caixa potencial</div>
        <div class="dec-val">${fmtBrl(caixaPot,0)}</div>
        <div class="dec-sub">${aReceber>0?`+ ${fmtBrl(aReceber,0)} a receber`:'sem a receber'}</div>
      </div>
      <div class="dec-tile ${recorrente>0?'ok':''}">
        <div class="dec-label">MRR (recorrente)</div>
        <div class="dec-val">${fmtBrl(recorrente,0)}</div>
        <div class="dec-sub">${recorrente>0?`ARR ${fmtBrl(arr,0)}`:'nada recorrente ainda'}</div>
      </div>
    </div>

    <div class="card mb16 fin-indep">
      <span class="fin-indep-ic">${recorrente>0&&mrrCobre>=100?'🟢':recorrente>0?'🟡':'⚪'}</span>
      <div>
        <div class="fin-indep-t">Independência ${mrrCobre!=null?`— MRR cobre ${mrrCobre}% do custo mensal`:''}</div>
        <div class="fin-indep-d">${recorrente<=0?'Sem receita recorrente. O norte é SaaS: transforme entregas avulsas em assinatura.':faltaMrr>0?`Faltam ${fmtBrl(faltaMrr,0)} de MRR pra cobrir suas despesas e viver disso.`:'Sua receita recorrente já cobre o custo mensal. Independência alcançada — agora é escalar.'}</div>
      </div>
    </div>
  `;
}

// ── COCKPIT DE TRABALHO (pipeline de clientes) ──
const CLI_ESTAGIOS = [
  { id:'lead',       lb:'Lead',       ic:'🔍', cor:'var(--text3)' },
  { id:'negociando', lb:'Negociando', ic:'💬', cor:'#3b82f6' },
  { id:'fechado',    lb:'Fechado',    ic:'🤝', cor:'#f59e0b' },
  { id:'entregando', lb:'Entregando', ic:'🚚', cor:'#38bdf8' },
  { id:'pago',       lb:'Pago',       ic:'✅', cor:'var(--green)' },
];
function trabalhoCockpitHtml(area){
  const det = area.detalhe||{};
  const funil = det.funil||[];
  const pipe = det.pipeline||{};
  const clientes = (det.clientes||[]).slice();
  const meta = D.meta||{};
  const metaClientes = (area.detalhe.campos&&area.detalhe.campos.metaClientes!=null)?area.detalhe.campos.metaClientes:3;
  const cfg = id => CLI_ESTAGIOS.find(e=>e.id===id) || CLI_ESTAGIOS[0];

  // próxima entrega: menor prazo entre fechado/entregando
  const comPrazo = clientes.filter(c=>c.prazo && (c.estagio==='fechado'||c.estagio==='entregando'));
  comPrazo.sort((a,b)=>a.prazo<b.prazo?-1:1);
  const prox = comPrazo[0];
  const proxDias = prox ? diasAte(prox.prazo) : null;

  const maxFun = Math.max(...funil.map(f=>f.count), 1);
  const funilHtml = funil.map(f=>{
    const e = cfg(f.estagio);
    return `<div class="funil-seg" style="--seg:${e.cor}">
      <div class="funil-bar"><div class="funil-fill" style="height:${Math.max(6,Math.round(f.count/maxFun*100))}%"></div></div>
      <div class="funil-n">${f.count}</div>
      <div class="funil-lb">${e.ic} ${e.lb}</div>
      <div class="funil-v">${f.valor?fmtBrl(f.valor,0):'—'}</div>
    </div>`;
  }).join('');

  // ordena clientes por estágio (pipeline order) e prazo
  const ord = Object.fromEntries(CLI_ESTAGIOS.map((e,i)=>[e.id,i]));
  clientes.sort((a,b)=>(ord[a.estagio]??0)-(ord[b.estagio]??0) || ((a.prazo||'')<(b.prazo||'')?-1:1));

  const listaHtml = clientes.length ? clientes.map(c=>{
    const e = cfg(c.estagio);
    const pills = CLI_ESTAGIOS.map(s=>`<button class="cli-pill ${c.estagio===s.id?'on':''}" style="--seg:${s.cor}" data-action="cliente-estagio" data-cid="${esc(c.id)}" data-estagio="${s.id}" title="${s.lb}">${s.ic}</button>`).join('');
    const prazoTxt = c.prazo ? ` · ${esc(c.prazo.slice(5))}` : '';
    return `<div class="cli-row">
      <div class="cli-main">
        <div class="cli-top"><span class="cli-nome">${esc(c.nome)}</span><span class="cli-prod">${esc(c.produto||'')}</span></div>
        <div class="cli-acao">${c.proximaAcao?`▸ ${esc(c.proximaAcao)}${prazoTxt}`:'<span style="color:var(--text3)">sem próxima ação</span>'}
          <button class="cli-mini" data-action="edit-proxima" data-cid="${esc(c.id)}" data-cur="${esc(c.proximaAcao||'')}" title="Editar próxima ação">✏️</button>
        </div>
      </div>
      <div class="cli-valor">${c.valor?fmtBrl(c.valor,0):'—'}</div>
      <div class="cli-pills">${pills}</div>
      <button class="cli-mini del" data-action="delete-cliente" data-cid="${esc(c.id)}" data-nome="${esc(c.nome)}" title="Remover">🗑</button>
    </div>`;
  }).join('') : '<div class="cli-empty">Nenhum cliente ainda. Adicione o primeiro abaixo — é daqui que sai o caixa.</div>';

  return `
    <div class="card mb16 funil-card">
      <div class="card-title">Pipeline de clientes <span style="color:var(--text3);font-weight:400">· ${pipe.clientesAtivos||0} ativos de ${metaClientes} · ${fmtBrl(pipe.aReceber||0,0)} a receber</span></div>
      <div class="funil">${funilHtml}</div>
    </div>

    <div class="decision-strip mb16">
      <div class="dec-tile ${(pipe.clientesAtivos||0)>=metaClientes?'ok':(pipe.clientesAtivos||0)>0?'warn':'bad'}">
        <div class="dec-label">Clientes ativos</div>
        <div class="dec-val">${pipe.clientesAtivos||0}<small> /${metaClientes}</small></div>
        <div class="dec-sub">negociando+fechado+entregando</div>
      </div>
      <div class="dec-tile">
        <div class="dec-label">A receber</div>
        <div class="dec-val">${fmtBrl(pipe.aReceber||0,0)}</div>
        <div class="dec-sub">${pipe.fechados||0} fechado(s)</div>
      </div>
      <div class="dec-tile ${(pipe.pagos||0)>0?'ok':''}">
        <div class="dec-label">Recebido</div>
        <div class="dec-val">${fmtBrl(pipe.recebido||0,0)}</div>
        <div class="dec-sub">${pipe.pagos||0} pago(s)</div>
      </div>
      <div class="dec-tile ${proxDias!=null&&proxDias<0?'bad':proxDias!=null&&proxDias<=7?'warn':''}">
        <div class="dec-label">Próxima entrega</div>
        <div class="dec-val">${proxDias==null?'—':proxDias<0?'atrasada':proxDias+'d'}</div>
        <div class="dec-sub">${prox?esc(prox.nome):'sem prazo definido'}</div>
      </div>
    </div>

    <div class="card mb16">
      <div class="card-title">Clientes</div>
      <div class="cli-list">${listaHtml}</div>
      <div class="cli-add">
        <input type="text" id="cli-nome" class="cli-inp" placeholder="Nome do cliente" maxlength="80">
        <input type="text" id="cli-prod" class="cli-inp" placeholder="Produto/serviço" maxlength="80">
        <input type="number" id="cli-valor" class="cli-inp cli-inp-val" placeholder="R$" step="50">
        <button class="meta-add-btn" data-action="add-cliente" title="Adicionar cliente">+</button>
      </div>
    </div>
  `;
}

// ── COCKPIT METAS & SONHOS ("A Bússola do Norte") ──
function metasCockpitHtml(area){
  const d = area.detalhe||{};
  const meta = D.meta||{};
  const goals = d.goals||[];
  const estrela = d.estrela;
  const mrr = d.mrr||0, mrrAlvo = d.mrrAlvo||5000, mrrPct = d.mrrPct||0;
  const cor = area.cor || '#a855f7';

  // ── Hero Estrela-Norte ──
  let heroHtml = '';
  if (estrela) {
    const tt = esc(estrela.titulo);
    const ws = tt.split(' ');
    const titleHtml = ws.length>1 ? `${ws.slice(0,-1).join(' ')} <b>${ws.slice(-1)}</b>` : `<b>${tt}</b>`;
    const dias = estrela.diasPrazo;
    const pct = estrela.pct||0;
    const metaLine = `${dias!=null?`faltam <b>${dias}</b> dias · `:''}${pct}% do caminho`;
    heroHtml = `<div class="card mb16 norte-hero">
      <div class="norte-orb"></div>
      <div class="norte-info">
        <div class="norte-eyebrow">POR QUE EU ACORDO CEDO</div>
        <div class="norte-title serif">${titleHtml}</div>
        <div class="norte-meta">${metaLine}</div>
      </div>
      <div class="norte-ringwrap">${ringHtml(pct,92,cor)}<div class="norte-ringnum">${pct}<small>%</small></div></div>
    </div>`;
  }

  // ── Ponte do MRR (a âncora) — tom firme com fé ──
  let mrrMsg;
  if (mrr<=0) mrrMsg = 'MRR zerado — o 1º cliente recorrente liga o relógio dos sonhos. Fé e disciplina: começa por R$1.';
  else if (mrr>=mrrAlvo) mrrMsg = '🎉 R$5k/mês recorrente. Independência na mira — agora é escalar.';
  else if (d.mrrGrowthEtaMeses!=null) mrrMsg = `Faltam ${fmtBrl(mrrAlvo-mrr,0)} · no ritmo atual, R$5k em ~${d.mrrGrowthEtaMeses} meses.`;
  else mrrMsg = `Faltam ${fmtBrl(mrrAlvo-mrr,0)} de MRR. Registra a recorrência em Finanças pra ver o ritmo.`;
  const mrrHtml = `<div class="card mb16 mrr-anchor">
    <div class="mrr-top">
      <div>
        <div class="dec-label">Renda recorrente — o motor dos sonhos</div>
        <div class="mrr-val serif">${fmtBrl(mrr,0)} <small>de ${fmtBrl(mrrAlvo,0)}/mês</small></div>
      </div>
      <div class="mrr-pct">${mrrPct}%</div>
    </div>
    <div class="fin-bar"><div class="fin-bar-fill ${mrr>=mrrAlvo?'done':''}" style="width:${mrrPct}%"></div></div>
    <div class="mrr-msg">${mrrMsg}</div>
  </div>`;

  // ── Strip da bússola ──
  const feitos = goals.filter(g=>g.feito).length, total = goals.length;
  const pm = d.proximoMarco;
  const caixaDias = diasAte(meta.caixaData);
  const cobre = d.cobreDespesa;
  const bussolaHtml = `<div class="decision-strip mb16">
    <div class="dec-tile ${feitos>0?'ok':''}">
      <div class="dec-label">Sonhos batidos</div>
      <div class="dec-val">${feitos}<small> /${total}</small></div>
      <div class="dec-sub">no horizonte</div>
    </div>
    <div class="dec-tile ${pm&&pm.diasPrazo!=null?(pm.diasPrazo<0?'bad':pm.diasPrazo<=30?'warn':''):''}">
      <div class="dec-label">Próximo marco</div>
      <div class="dec-val">${pm&&pm.diasPrazo!=null?(pm.diasPrazo<0?'venc.':pm.diasPrazo+'d'):'—'}</div>
      <div class="dec-sub">${pm?esc(pm.titulo):'tudo conquistado'}</div>
    </div>
    <div class="dec-tile ${caixaDias!=null?(caixaDias<0?'bad':caixaDias<=7?'warn':''):''}">
      <div class="dec-label">1ª ficha de dominó</div>
      <div class="dec-val">${caixaDias!=null?(caixaDias<0?'venc.':caixaDias+'d'):'—'}</div>
      <div class="dec-sub">${fmtBrl(meta.caixaValor||1000,0)} via Claude</div>
    </div>
    <div class="dec-tile ${cobre?'ok':''}">
      <div class="dec-label">Independência</div>
      <div class="dec-val">${cobre==null?'—':cobre?'✓':'não'}</div>
      <div class="dec-sub">MRR cobre o custo</div>
    </div>
  </div>`;

  // ── Passo único da semana ──
  const passo = d.passoSemana||'';
  const passoHtml = `<div class="card mb16 passo-card ${d.passoFeito?'done':''}">
    <div class="passo-check ${d.passoFeito?'done':''}" data-action="passo-toggle" title="Marcar o passo da semana">${d.passoFeito?'✓':''}</div>
    <div class="passo-body">
      <div class="dec-label">O passo desta semana rumo ao R$5k</div>
      <div class="passo-text ${!passo?'empty':''}">${passo?esc(passo):'Escolhe UMA ação que aproxima a renda recorrente — não dez.'}</div>
    </div>
    <button class="hz-act" data-action="edit-passo" data-cur="${esc(passo)}" title="Editar passo">✏️</button>
  </div>`;

  // ── Bilhete pro futuro-eu ──
  const porque = d.porqueRaiz||'';
  const bilheteHtml = `<div class="card mb16 bilhete">
    <div class="bilhete-q">"</div>
    <div class="bilhete-txt serif">${esc(porque)}</div>
    <button class="hz-act bilhete-edit" data-action="edit-porque" data-cur="${esc(porque)}" title="Editar o porquê">✏️</button>
  </div>`;

  // ── Linha do Horizonte ──
  function etaInfo(g){
    if(g.feito) return {label:'conquistado', cls:'ok'};
    if(g.fonteRitmo==='savings'){
      if(g.temRitmo) return {label:`~${g.etaMeses} meses`, cls: g.etaMeses>24?'warn':''};
      return (g.alvo>g.atual)?{label:'sem ritmo', cls:'warn'}:{label:'', cls:''};
    }
    if(g.fonteRitmo==='mrr'){
      if(g.custo>0&&g.temRitmo) return {label:`~${g.etaMeses} meses`, cls: g.etaMeses>24?'warn':''};
      return {label:'sem renda recorrente, sem data', cls:'warn'};
    }
    if(g.diasPrazo!=null) return {label:`${g.diasPrazo}d`, cls: g.diasPrazo<0?'bad':g.diasPrazo<=30?'warn':''};
    return {label:'', cls:''};
  }
  function barOrPill(g){
    if(!g.fonteRitmo) return '';
    let sub='';
    if(g.fonteRitmo==='savings') sub=`${fmtBrl(g.atual||0,0)} de ${fmtBrl(g.alvo||0,0)}`;
    else if(g.fonteRitmo==='mrr'&&g.custo>0) sub=`custa ${fmtBrl(g.custo,0)} · no ritmo do teu MRR`;
    return `<div class="fin-bar hz-bar"><div class="fin-bar-fill ${g.feito?'done':''}" style="width:${g.pct||0}%"></div></div>${sub?`<div class="hz-sub">${sub}</div>`:''}`;
  }
  const horizonRows = goals.map(g=>{
    const eta = etaInfo(g);
    return `<div class="hz-goal ${g.feito?'done':''}">
      <div class="hz-node ${g.feito?'done':''} ${g.estrela?'star':''}" data-action="goal-feito" data-gid="${esc(g.id)}" title="${g.feito?'Concluído':'Marcar como conquistado'}">${g.feito?'✓':g.estrela?'★':''}</div>
      <div class="hz-body">
        <div class="hz-head">
          <span class="hz-title serif">${esc(g.emoji||'🎯')} ${esc(g.titulo)}</span>
          ${eta.label?`<span class="hz-eta ${eta.cls}">${eta.label}</span>`:''}
        </div>
        ${g.porque?`<div class="hz-porque">${esc(g.porque)}</div>`:''}
        ${barOrPill(g)}
      </div>
      <div class="hz-actions">
        ${!g.estrela?`<button class="hz-act" data-action="goal-estrela" data-gid="${esc(g.id)}" title="Definir como sonho nº1">☆</button>`:''}
        <button class="hz-act" data-action="edit-goal" data-gid="${esc(g.id)}" data-titulo="${esc(g.titulo)}" data-porque="${esc(g.porque||'')}" title="Editar">✏️</button>
        <button class="hz-act del" data-action="delete-goal" data-gid="${esc(g.id)}" data-titulo="${esc(g.titulo)}" title="Remover">🗑</button>
      </div>
    </div>`;
  }).join('') || '<div class="cli-empty">Sem sonhos no horizonte. Adicione o primeiro abaixo.</div>';
  const horizonHtml = `<div class="card mb16">
    <div class="card-title">A linha do horizonte</div>
    <div class="horizon"><div class="hz-line"></div>${horizonRows}</div>
    <div class="goal-add">
      <input type="text" id="goal-nome" class="cli-inp" placeholder="Novo sonho..." maxlength="120">
      <input type="number" id="goal-custo" class="cli-inp cli-inp-val" placeholder="R$ custo" step="100">
      <select id="goal-fonte" class="cli-inp goal-sel" title="Como progride">
        <option value="">marco simples</option>
        <option value="savings">poupança</option>
        <option value="mrr">recorrência</option>
      </select>
      <button class="meta-add-btn" data-action="add-goal" title="Adicionar sonho">+</button>
    </div>
  </div>`;

  // ── Espelho do Porsche (custo de oportunidade) ──
  const pr = d.porscheReframe||{};
  const porscheHtml = (pr.metaPorsche>0) ? `<div class="card mb16 porsche-mirror">
    <span class="pm-ic">🏎️</span>
    <div>
      <div class="pm-t">O Porsche é consequência, não atalho</div>
      <div class="pm-d">${fmtBrl(pr.metaPorsche,0)} = <b>${pr.mesesMrr} meses</b> do teu MRR-alvo. O carro custa <b>${pr.ratioVsSofia}×</b> a viagem pra Sofia. Primeiro a renda recorrente — o Porsche vem sozinho depois.</div>
    </div>
  </div>` : '';

  return heroHtml + mrrHtml + bussolaHtml + passoHtml + bilheteHtml + horizonHtml + porscheHtml;
}

// ── ÁREA MANUAL (Saúde e modelo futuro) ──
function renderManualArea(area) {
  const det = area.detalhe||{};
  const campos = det.campos||{};
  const historico = det.historico||{};
  const camposEditaveis = det.camposEditaveis||[];

  const body = $('detail-body');
  body.style.setProperty('--area-color', area.cor || 'var(--red)');

  // KPIs resumo (com tendência quando o KPI casa um campo com histórico)
  const kpiHtml = (area.resumo||[]).map(r=>{
    const lc = (r.label||'').toLowerCase();
    const campoT = camposEditaveis.find(c=>c.historico && (
      c.label.toLowerCase().includes(lc) || lc.includes(c.label.toLowerCase().split(' ')[0])
    ));
    const trend = campoT ? trendChip(historico[campoT.id]) : '';
    return `<div class="kpi">
      <div class="kpi-label">${esc(r.label)}</div>
      <div class="kpi-val">${esc(String(r.valor??'—'))} ${trend}</div>
      ${r.delta?`<div class="kpi-sub">${esc(r.delta)}</div>`:''}
    </div>`;
  }).join('');

  // Campos editáveis (com steppers +/− e chip de tendência)
  const camposHtml = `<div class="campos-grid">${camposEditaveis.map(c=>{
    const val = campos[c.id];
    const step = stepFor(c.unidade);
    const trend = c.historico ? trendChip(historico[c.id]) : '';
    return `<div class="campo-item">
      <div class="campo-label">${esc(c.label)} ${trend}</div>
      <div class="campo-row">
        <button class="campo-step minus" data-step="-${step}" data-campo="${esc(c.id)}" aria-label="Diminuir">−</button>
        <input type="number" class="campo-input" id="campo-${esc(c.id)}" data-campo="${esc(c.id)}" data-hist="${c.historico?'1':''}" value="${val??''}" placeholder="—" step="${step}">
        <span class="campo-unidade">${esc(c.unidade)}</span>
        <button class="campo-step plus" data-step="${step}" data-campo="${esc(c.id)}" aria-label="Aumentar">+</button>
      </div>
      <button class="campo-save-btn" id="save-${esc(c.id)}" data-campo="${esc(c.id)}">salvar</button>
    </div>`;
  }).join('')}</div>`;

  // Metas
  const metasHtml = (area.metas||[]).map(m=>`<div class="meta-item ${m.feito?'done':''}" data-meta-id="${esc(m.id)}">
    <div class="meta-check ${m.feito?'done':''} ${!m.auto?'clickable':''}"
      ${!m.auto?`data-area="${esc(area.id)}" data-meta="${esc(m.id)}"`:''}
    >${m.feito?'✓':''}</div>
    <span class="meta-texto">${esc(m.texto)}</span>
    ${m.atual!=null&&m.alvo!=null?`<span class="meta-progress">${m.atual}/${m.alvo}</span>`:''}
    ${m.auto?'<span class="meta-group">auto</span>':''}
    ${!m.auto?`<span class="meta-actions">
      <button class="meta-action-btn edit-meta" data-action="edit-meta" data-area="${esc(area.id)}" data-meta="${esc(m.id)}" data-texto="${esc(m.texto)}" title="Editar">✏️</button>
      <button class="meta-action-btn del delete-meta" data-action="delete-meta" data-area="${esc(area.id)}" data-meta="${esc(m.id)}" title="Deletar">🗑</button>
    </span>`:''}
  </div>`).join('');

  // Histórico com insight: label amigável, gráfico maior, atual + min/máx + tendência
  const labelDe = id => (camposEditaveis.find(c=>c.id===id)?.label) || id;
  const unidDe  = id => (camposEditaveis.find(c=>c.id===id)?.unidade) || '';
  const sparkHtml = Object.entries(historico).map(([k,pts])=>{
    if(!pts||pts.length<2) return '';
    const recent = pts.slice(-14);
    const vals = recent.map(p=>Number(p.v));
    const cur = vals[vals.length-1];
    const mn = Math.min(...vals), mx = Math.max(...vals);
    const u = unidDe(k);
    const fmt = n => Number(n).toLocaleString('pt-BR',{maximumFractionDigits:1});
    return `<div class="hist-row">
      <div class="hist-head">
        <span class="hist-label">${esc(labelDe(k))}</span>
        ${trendChip(pts)}
      </div>
      <div class="hist-chart">${sparkArea(vals,260,46,'var(--area-color, var(--red2))')}</div>
      <div class="hist-meta">
        <span class="hist-cur">${fmt(cur)}<small>${esc(u)}</small></span>
        <span class="hist-mm">mín ${fmt(mn)} · máx ${fmt(mx)} · ${recent.length} reg.</span>
      </div>
    </div>`;
  }).join('');

  // ── Progresso: check-in, missões, conquistas ──
  const prog = area.progress || {};
  const st = prog.streak||{};
  const ckIn = prog.checkin||{};

  const checkinHtml = `<div class="card mb16" style="--area-color:${esc(area.cor)}">
    <div class="checkin-card">
      <div class="checkin-left">
        <div>
          <div class="checkin-stat-num checkin-stat-flame">🔥 ${st.atual||0}</div>
          <div class="checkin-stat-label">Sequência</div>
        </div>
        <div>
          <div class="checkin-stat-num">${st.recorde||0}</div>
          <div class="checkin-stat-label">Recorde</div>
        </div>
        <div>
          <div class="checkin-stat-num">${ckIn.totalDias||0}</div>
          <div class="checkin-stat-label">Dias totais</div>
        </div>
      </div>
      <button class="checkin-btn ${ckIn.feitoHoje?'done':''}" data-action="checkin" data-area="${esc(area.id)}">
        ${ckIn.feitoHoje?'✓ Check-in feito':'Fazer check-in de hoje'}
      </button>
    </div>
  </div>`;

  const missoes = prog.missoes||[];
  const missoesHtml = missoes.length ? `<div class="card mb16">
    <div class="card-title">Missões</div>
    <div class="missoes-list">
      ${missoes.map(m=>{
        const podeToggle = m.manual; // só missões manuais togglam; as automáticas refletem o estado
        return `<div class="missao-item ${m.feita?'done':''}" ${podeToggle?`data-action="missao" data-area="${esc(area.id)}" data-missao="${esc(m.id)}" style="cursor:pointer"`:'style="cursor:default"'}>
          <div class="missao-check">${m.feita?'✓':''}</div>
          <span class="missao-icone">${m.icone}</span>
          <span class="missao-nome">${esc(m.nome)}</span>
          <span class="missao-tags">
            <span class="missao-periodo">${m.periodo}</span>
            <span class="missao-xp">+${m.xp} XP</span>
          </span>
        </div>`;
      }).join('')}
    </div>
  </div>` : '';

  const badges = prog.badges||[];
  const badgesHtml = badges.length ? `<div class="card mb16">
    <div class="card-title">Conquistas <span style="color:var(--text3);font-weight:400">(${badges.filter(b=>b.conquistada).length}/${badges.length})</span></div>
    <div class="ach-grid">
      ${badges.map(b=>{
        let pbar = '';
        if (!b.conquistada && b.progresso && b.progresso.meta>0) {
          const pct = Math.min(100, Math.round((b.progresso.atual/b.progresso.meta)*100));
          pbar = `<div class="ach-pbar"><div class="ach-pfill" style="width:${pct}%"></div></div>`;
        }
        return `<div class="ach-item ${b.conquistada?'earned':''}" style="${b.conquistada?'':'opacity:.55'}">
          <span class="ach-icon">${b.conquistada?b.icone:'🔒'}</span>
          <div style="flex:1">
            <div class="ach-name">${esc(b.nome)}</div>
            <div class="ach-desc">${esc(b.desc)}</div>
            ${pbar}
          </div>
        </div>`;
      }).join('')}
    </div>
  </div>` : '';

  // Na área Metas, o horizonte (cockpit) substitui a lista genérica de metas;
  // sobra só o card de registro (steppers do Porsche), em largura cheia.
  const editarBloco = area.id==='metas'
    ? `<div class="card mb16">
        <div class="card-title">Guardar pro Porsche</div>
        ${camposHtml}
      </div>`
    : `<div class="grid2 mb16">
      <div class="card">
        <div class="card-title">Registrar / Editar</div>
        ${camposHtml}
      </div>
      <div class="card">
        <div class="card-title">Metas</div>
        <div class="metas-list" id="metas-list-${esc(area.id)}">${metasHtml||'<div style="color:var(--text3);font-size:12px">Sem metas configuradas</div>'}</div>
        <div class="meta-add-row" style="margin-top:10px;">
          <input type="text" class="meta-add-input" id="meta-add-input-${esc(area.id)}" placeholder="Nova meta..." maxlength="200">
          <button class="meta-add-btn" id="meta-add-btn-${esc(area.id)}" data-action="add-meta" data-area="${esc(area.id)}">+</button>
        </div>
      </div>
    </div>`;

  body.innerHTML = `
    ${area.id==='financas' ? financasCockpitHtml(area) : ''}
    ${area.id==='trabalho' ? trabalhoCockpitHtml(area) : ''}
    ${area.id==='metas' ? metasCockpitHtml(area) : ''}
    <div class="kpi-row mb16">${kpiHtml}</div>
    ${checkinHtml}
    ${missoesHtml}
    ${editarBloco}
    ${badgesHtml}
    ${sparkHtml?`<div class="card mb16" style="--area-color:${esc(area.cor)}">
      <div class="card-title">Histórico</div>
      <div class="hist-grid">${sparkHtml}</div>
    </div>`:''}
  `;

  // mostrar botão salvar ao editar campo (input não é mutação remota → fica fora da delegação)
  body.querySelectorAll('.campo-input').forEach(input=>{
    const saveBtn = $('save-'+input.dataset.campo);
    input.addEventListener('input',()=>{ if(saveBtn) saveBtn.style.display='block'; });
  });

  bindDetailDelegation(area.id);
}

// Delegação única em #detail-body. Um listener despacha por data-action.
// Flag `mutating` bloqueia clique duplo / mutação concorrente.
// Re-bind seguro: substitui o handler anterior antes de adicionar o novo.
let _detailHandler = null;
let _detailKeyHandler = null;
function bindDetailDelegation(areaId) {
  const body = $('detail-body');
  if (_detailHandler) body.removeEventListener('click', _detailHandler);
  if (_detailKeyHandler) body.removeEventListener('keydown', _detailKeyHandler);

  _detailHandler = async (e) => {
    // stepper +/− : ajusta o valor do input e revela o salvar (sem persistir ainda)
    const step = e.target.closest('.campo-step');
    if (step) {
      const input = body.querySelector(`.campo-input[data-campo="${step.dataset.campo}"]`);
      if (input) {
        const delta = parseFloat(step.dataset.step) || 0;
        const cur = parseFloat(input.value) || 0;
        let next = Math.round((cur + delta) * 100) / 100; // evita 0.30000004
        if (next < 0) next = 0;
        input.value = next;
        const sb = $('save-'+step.dataset.campo);
        if (sb) sb.style.display = 'block';
        input.focus();
      }
      return;
    }
    // botão salvar de campo
    const saveBtn = e.target.closest('.campo-save-btn');
    if (saveBtn) {
      const input = body.querySelector(`.campo-input[data-campo="${saveBtn.dataset.campo}"]`);
      if (input) await guard(()=>saveCampo(areaId, input));
      return;
    }
    // toggle de meta manual
    const metaCheck = e.target.closest('.meta-check[data-meta]');
    if (metaCheck) {
      const metaId = metaCheck.dataset.meta;
      const a2 = (D.areas||[]).find(a=>a.id===areaId);
      const meta = a2?.metas?.find(m=>m.id===metaId);
      const newVal = !(meta?.feito);
      await guard(async()=>{
        metaCheck.textContent='…';
        await patchArea(areaId,{metasManual:{[metaId]:newVal}});
        await load(false);
        toast(newVal?'✓ Meta concluída':'Meta desmarcada');
      });
      return;
    }
    const el = e.target.closest('[data-action]');
    if (!el) return;
    const action = el.dataset.action;

    if (action === 'add-meta') {
      const inp = $('meta-add-input-'+areaId);
      const texto = inp?.value?.trim();
      if (!texto) return;
      await guard(async()=>{
        inp.value='';
        await postJson(`/api/area/${encodeURIComponent(areaId)}/meta`,{texto});
        await load(false); toast('✓ Meta criada');
      });
    } else if (action === 'edit-meta') {
      e.stopPropagation();
      const metaId = el.dataset.meta;
      const novo = prompt('Editar meta:', el.dataset.texto);
      if (novo===null || !novo.trim()) return;
      await guard(async()=>{
        await fetch(`/api/area/${encodeURIComponent(areaId)}/meta/${encodeURIComponent(metaId)}`,{
          method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({texto:novo.trim()})
        });
        await load(false); toast('✓ Meta atualizada');
      });
    } else if (action === 'delete-meta') {
      e.stopPropagation();
      const metaId = el.dataset.meta;
      const item = el.closest('.meta-item');
      const texto = item?.querySelector('.meta-texto')?.textContent || metaId;
      if (!confirm(`Deletar meta "${texto}"?`)) return;
      await guard(async()=>{
        await fetch(`/api/area/${encodeURIComponent(areaId)}/meta/${encodeURIComponent(metaId)}`,{method:'DELETE'});
        await load(false); toast('Meta removida');
      });
    } else if (action === 'checkin') {
      await guard(async()=>{
        el.classList.add('busy');
        const j = await postJson(`/api/area/${encodeURIComponent(areaId)}/checkin`,{});
        await load(false);
        toast(j.feito?'✓ Check-in registrado':'Check-in desfeito');
      });
    } else if (action === 'missao') {
      const missaoId = el.dataset.missao;
      await guard(async()=>{
        const j = await postJson(`/api/area/${encodeURIComponent(areaId)}/missao/${encodeURIComponent(missaoId)}`,{});
        await load(false);
        toast(j.feita?'✓ Missão concluída':'Missão desmarcada');
      });
    } else if (action === 'add-cliente') {
      const nome = $('cli-nome')?.value?.trim();
      const produto = $('cli-prod')?.value?.trim()||'';
      const valor = parseFloat($('cli-valor')?.value)||0;
      if(!nome){ toast('Informe o nome do cliente'); return; }
      await guard(async()=>{
        await postJson(`/api/area/${encodeURIComponent(areaId)}/cliente`,{nome,produto,valor,estagio:'lead'});
        await load(false); toast('✓ Cliente adicionado');
      });
    } else if (action === 'cliente-estagio') {
      const cid = el.dataset.cid, estagio = el.dataset.estagio;
      await guard(async()=>{
        const r = await fetch(`/api/area/${encodeURIComponent(areaId)}/cliente/${encodeURIComponent(cid)}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({estagio})});
        const j = await r.json(); if(!j.ok) throw new Error(j.error||'erro');
        await load(false); toast('Estágio: '+estagio);
      });
    } else if (action === 'edit-proxima') {
      e.stopPropagation();
      const cid = el.dataset.cid;
      const novo = prompt('Próxima ação:', el.dataset.cur||'');
      if(novo===null) return;
      await guard(async()=>{
        const r = await fetch(`/api/area/${encodeURIComponent(areaId)}/cliente/${encodeURIComponent(cid)}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({proximaAcao:novo.trim()})});
        const j = await r.json(); if(!j.ok) throw new Error(j.error||'erro');
        await load(false); toast('✓ Atualizado');
      });
    } else if (action === 'delete-cliente') {
      e.stopPropagation();
      const cid = el.dataset.cid;
      if(!confirm(`Remover cliente "${el.dataset.nome||cid}"?`)) return;
      await guard(async()=>{
        await fetch(`/api/area/${encodeURIComponent(areaId)}/cliente/${encodeURIComponent(cid)}`,{method:'DELETE'});
        await load(false); toast('Cliente removido');
      });
    } else if (action === 'add-goal') {
      const titulo = $('goal-nome')?.value?.trim();
      if(!titulo){ toast('Dê um nome ao sonho'); return; }
      const custo = parseFloat($('goal-custo')?.value)||0;
      const fonteRitmo = $('goal-fonte')?.value||null;
      await guard(async()=>{
        await postJson(`/api/area/${encodeURIComponent(areaId)}/goal`,{titulo,custo,fonteRitmo});
        await load(false); toast('✓ Sonho adicionado ao horizonte');
      });
    } else if (action === 'goal-feito') {
      const gid = el.dataset.gid;
      const g = (D.areas||[]).find(a=>a.id===areaId)?.detalhe?.goals?.find(x=>x.id===gid);
      const novo = !(g?.feito);
      await guard(async()=>{
        await fetch(`/api/area/${encodeURIComponent(areaId)}/goal/${encodeURIComponent(gid)}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({feito:novo})});
        await load(false); toast(novo?'✓ Sonho conquistado!':'Sonho reaberto');
      });
    } else if (action === 'goal-estrela') {
      const gid = el.dataset.gid;
      await guard(async()=>{
        await fetch(`/api/area/${encodeURIComponent(areaId)}/goal/${encodeURIComponent(gid)}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({estrela:true})});
        await load(false); toast('★ Novo sonho nº1');
      });
    } else if (action === 'edit-goal') {
      e.stopPropagation();
      const gid = el.dataset.gid;
      const novoT = prompt('Nome do sonho:', el.dataset.titulo||'');
      if(novoT===null || !novoT.trim()) return;
      const novoP = prompt('Por quê (o motivo, 1 linha):', el.dataset.porque||'');
      await guard(async()=>{
        await fetch(`/api/area/${encodeURIComponent(areaId)}/goal/${encodeURIComponent(gid)}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({titulo:novoT.trim(), porque:(novoP||'').trim()})});
        await load(false); toast('✓ Sonho atualizado');
      });
    } else if (action === 'delete-goal') {
      e.stopPropagation();
      const gid = el.dataset.gid;
      if(!confirm(`Remover "${el.dataset.titulo||gid}" do horizonte?`)) return;
      await guard(async()=>{
        await fetch(`/api/area/${encodeURIComponent(areaId)}/goal/${encodeURIComponent(gid)}`,{method:'DELETE'});
        await load(false); toast('Sonho removido');
      });
    } else if (action === 'passo-toggle') {
      await guard(async()=>{
        const j = await postJson(`/api/area/${encodeURIComponent(areaId)}/missao/passo-semana`,{});
        await load(false); toast(j.feita?'✓ Passo da semana feito':'Passo reaberto');
      });
    } else if (action === 'edit-passo') {
      e.stopPropagation();
      const novo = prompt('O passo desta semana rumo ao R$5k:', el.dataset.cur||'');
      if(novo===null || !novo.trim()) return;
      await guard(async()=>{
        await fetch(`/api/area/${encodeURIComponent(areaId)}/meta/passo-semana`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({texto:novo.trim()})});
        await load(false); toast('✓ Passo definido');
      });
    } else if (action === 'edit-porque') {
      e.stopPropagation();
      const novo = prompt('O porquê — escreve com tuas palavras (prazo e número, não frase de Instagram):', el.dataset.cur||'');
      if(novo===null || !novo.trim()) return;
      await guard(async()=>{
        await fetch(`/api/area/${encodeURIComponent(areaId)}/meta/porqueRaiz`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({texto:novo.trim()})});
        await load(false); toast('✓ Bilhete atualizado');
      });
    }
  };

  _detailKeyHandler = async (e) => {
    if (e.key !== 'Enter') return;
    if (e.target.classList.contains('campo-input')) {
      e.preventDefault();
      await guard(()=>saveCampo(areaId, e.target));
    } else if (e.target.classList.contains('meta-add-input')) {
      e.preventDefault();
      const texto = e.target.value.trim();
      if (!texto) return;
      await guard(async()=>{
        e.target.value='';
        await postJson(`/api/area/${encodeURIComponent(areaId)}/meta`,{texto});
        await load(false); toast('✓ Meta criada');
      });
    } else if (e.target.id && e.target.id.indexOf('goal-')===0) {
      e.preventDefault();
      const titulo = $('goal-nome')?.value?.trim();
      if(!titulo){ toast('Dê um nome ao sonho'); return; }
      const custo = parseFloat($('goal-custo')?.value)||0;
      const fonteRitmo = $('goal-fonte')?.value||null;
      await guard(async()=>{
        await postJson(`/api/area/${encodeURIComponent(areaId)}/goal`,{titulo,custo,fonteRitmo});
        await load(false); toast('✓ Sonho adicionado ao horizonte');
      });
    } else if (e.target.classList.contains('cli-inp')) {
      e.preventDefault();
      const nome = $('cli-nome')?.value?.trim();
      if(!nome){ toast('Informe o nome do cliente'); return; }
      const produto = $('cli-prod')?.value?.trim()||'';
      const valor = parseFloat($('cli-valor')?.value)||0;
      await guard(async()=>{
        await postJson(`/api/area/${encodeURIComponent(areaId)}/cliente`,{nome,produto,valor,estagio:'lead'});
        await load(false); toast('✓ Cliente adicionado');
      });
    }
  };

  body.addEventListener('click', _detailHandler);
  body.addEventListener('keydown', _detailKeyHandler);
}

// Executa fn protegida contra reentrância (clique duplo / mutação concorrente).
async function guard(fn) {
  if (mutating) return;
  mutating = true;
  try { await fn(); }
  catch(e){ toast('Erro: '+(e.message||e)); }
  finally { mutating = false; }
}

async function postJson(url, body) {
  const r = await fetch(url, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body||{}) });
  const j = await r.json();
  if (!j.ok) throw new Error(j.error||'erro');
  return j;
}

async function saveCampo(areaId, input) {
  const campo = input.dataset.campo;
  const val = parseFloat(input.value);
  if(isNaN(val)){toast('Valor inválido');return;}
  const isHist = input.dataset.hist==='1';
  const saveBtn=$('save-'+campo);
  try {
    if(saveBtn){saveBtn.textContent='…';saveBtn.disabled=true;}
    await patchArea(areaId,{campos:{[campo]:val}});
    if(isHist){
      await fetch(`/api/area/${encodeURIComponent(areaId)}/history`,{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({campo,valor:val})
      });
    }
    await load(false);
    toast('✓ Salvo');
  } catch(e){
    toast('Erro: '+e.message);
    // falhou → reabilita o botão pra nova tentativa
    if(saveBtn){saveBtn.textContent='↑ salvar';saveBtn.disabled=false;saveBtn.style.display='block';}
  }
}

async function patchArea(areaId, patch) {
  const r=await fetch(`/api/area/${encodeURIComponent(areaId)}`,{
    method:'PATCH',headers:{'Content-Type':'application/json'},
    body:JSON.stringify(patch)
  });
  const j=await r.json();
  if(!j.ok) throw new Error(j.error||'erro');
}

// ── SETTINGS ──
function renderSettings() {
  const prof = D.claudeRaw?.overview?.profile||{};
  const h = D.health||{};
  $('cfg-name').textContent = prof.name||'';
  $('cfg-usd').textContent = (D.claudeRaw?.overview?.cost?.rate||5.4).toFixed(2);
  $('health-block').innerHTML = [
    `Parseadas: <b style="color:var(--text)">${h.filesParsed}</b> sessões (${h.cacheHits} do cache)`,
    `Parse: <b style="color:var(--text)">${h.parseMs}ms</b>`,
    `Erros: <b style="color:${h.parseErrors>0?'var(--red)':'var(--text)'}">${h.parseErrors}</b>`,
    `Claude dir: <span style="font-family:var(--mono);font-size:11px;color:var(--text3)">${esc(h.claudeDir)}</span>`,
    `Skills: <b>${h.hasSkills?'sim':'não'}</b> · MCPs: <b>${h.connectedMcp}</b>`,
    h.warnings?.length?`<span style="color:var(--yellow)">⚠ ${esc(h.warnings.join(' · '))}</span>`:'',
  ].filter(Boolean).join('<br>');

  function setupEditable(id, saveFn) {
    const el=$(id);
    el.addEventListener('keydown',async e=>{
      if(e.key==='Enter'){e.preventDefault();el.blur();try{await saveFn(el.textContent.trim());toast('Salvo ✓');}catch(err){toast('Erro: '+err.message);}}
      if(e.key==='Escape') el.blur();
    });
  }
  setupEditable('cfg-name',async val=>{
    await fetch('/api/config',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({profileName:val})});
    await load(false);
  });
  setupEditable('cfg-usd',async val=>{
    const n=parseFloat(val.replace(',','.'));
    if(!isNaN(n)&&n>0){
      await fetch('/api/config',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({usdToBrl:n})});
      await load(true);
    }
  });
}

// ── INIT ──
$('btn-refresh').addEventListener('click',async()=>{
  $('btn-refresh').textContent='…';
  await load(true);
  $('btn-refresh').textContent='↻';
  toast('Atualizado');
});

// Preload hero image
const img=new Image();
img.src='/assets/porsche.jpg';

load(false);
